# Real client IP for the API's login rate limit. Behind the OpenShift router, the router
# appends the client's address as the LAST X-Forwarded-For entry (earlier entries are whatever
# the client sent, so they can't be trusted). Without a router: the direct peer address.
map $http_x_forwarded_for $client_ip {
    ""                       $remote_addr;
    "~(?<last_ip>[^,\s]+)\s*$" $last_ip;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    # /api/* -> api:8000/*. Buffering off so the agent trace streams (SSE) in real time.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $client_ip;
        # Keep the scheme the browser used (the OpenShift router terminates TLS before nginx).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
