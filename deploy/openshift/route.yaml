# OpenShift Route: public HTTPS entry point for the UI (TLS terminated at the router).
# The UI proxies /api/* to the api Service internally, so only "web" is exposed.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
spec:
  to: { kind: Service, name: web }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
