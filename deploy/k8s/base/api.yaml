# FastAPI backend: 2+ replicas behind a Service. Stateless: all shared state is external
# (sessions/locks in Redis + Postgres, documents/chunks/runs in Postgres).
#
# Probes:
#   startup    /health with a long budget: the first start downloads ~200 MB of models
#   readiness  /health: 503 when Postgres is down -> pod leaves the Service; a Redis outage
#              returns 200 "degraded", so the API keeps serving
#   liveness   TCP only: a DB outage must not make Kubernetes restart healthy API pods
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # zero-downtime updates
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/amaanmithani/nyu-agentic-rag-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: rag-config }
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: rag-secrets, key: ANTHROPIC_API_KEY } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: rag-secrets, key: POSTGRES_PASSWORD } }
            - name: APP_PASSWORD # optional: login is off when the key is absent
              valueFrom: { secretKeyRef: { name: rag-secrets, key: APP_PASSWORD, optional: true } }
            - name: DATABASE_URL # $(VAR) expands env vars defined above
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          lifecycle:
            # Keep serving for a few seconds after shutdown starts, while the endpoint is
            # removed from the Service. Without it, ~1% of requests failed during a rollout.
            preStop:
              exec: { command: ["sleep", "5"] }
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2560Mi }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: models, mountPath: /models }
      volumes:
        # Per-pod scratch space, so the API is stateless and can be scheduled on any node.
        # A shared ReadWriteOnce volume made scaled-out pods on other nodes fail with
        # "Multi-Attach error" on a multi-node OpenShift cluster. Neither needs sharing:
        # an uploaded PDF is only read by the background ingest in the same pod (results go
        # to Postgres), and each pod downloads its ~150 MB of models once at startup.
        # Production: bake the models into the image; uploads to object storage + a worker.
        - name: uploads
          emptyDir: { sizeLimit: 1Gi }
        - name: models
          emptyDir: { sizeLimit: 1Gi }
---
# Scale the API on CPU (embedding + reranking are CPU-bound). Needs metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
