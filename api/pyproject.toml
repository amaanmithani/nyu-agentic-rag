[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.2",
    "pypdf>=6.21.4",
    "fastembed>=0.9.1",
    "python-multipart>=0.0.33",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
